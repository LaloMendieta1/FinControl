<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saldo — Control de finanzas personales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1EE; --surface:#FFFFFF; --surface-2:#F6F8F5;
    --ink:#11241F; --ink-soft:#5C6B64; --ink-faint:#8A968F;
    --teal:#16544A; --teal-soft:#D5E4DF;
    --green:#0E9E73; --green-soft:#D6F0E5;
    --amber:#E0922F; --amber-soft:#F8E7CC;
    --coral:#E14B33; --coral-soft:#FADDD6;
    --line:#DFE5E0;
    --shadow:0 1px 2px rgba(17,36,31,.04), 0 8px 28px rgba(17,36,31,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 80px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px}

  header{padding:26px 0 4px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-family:"Fraunces",serif;font-weight:600;font-size:30px;letter-spacing:-.01em;line-height:1}
  .brand .mark{width:13px;height:13px;border-radius:50%;background:var(--green);flex:none;align-self:center;box-shadow:0 0 0 4px var(--green-soft)}
  .tag{color:var(--ink-soft);font-size:13.5px;margin-top:6px}

  .income-card{background:var(--teal);color:#EAF4F0;border-radius:var(--radius);padding:18px 20px;margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:var(--shadow)}
  .income-card .lbl{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:#9DC4BA}
  .income-amt{font-size:30px;font-weight:600;line-height:1.1;margin-top:2px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .income-amt .pen{opacity:.55;font-size:15px}
  .income-amt:hover .pen{opacity:1}
  .income-input{font-family:"Space Grotesk";font-size:26px;font-weight:600;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:4px 10px;width:190px}
  .income-input:focus{outline:none;border-color:#fff}
  .freq-toggle{display:flex;background:rgba(255,255,255,.12);border-radius:9px;padding:3px}
  .freq-toggle button{background:none;border:none;color:#BBD6CE;font-family:inherit;font-size:12px;padding:5px 10px;border-radius:7px;cursor:pointer;font-weight:500}
  .freq-toggle button.on{background:#fff;color:var(--teal)}

  .month-pill{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:13.5px;color:var(--ink-soft)}
  .month-pill .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .month-pill b{color:var(--ink);font-weight:600;font-family:"Fraunces";font-size:15px}

  section{margin-top:18px}
  .hero{background:var(--surface);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
  .status-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .status-left .small{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
  .status-big{font-family:"Fraunces",serif;font-size:46px;font-weight:600;line-height:1;margin-top:4px;letter-spacing:-.02em}
  .status-sub{font-size:13.5px;color:var(--ink-soft);margin-top:6px}
  .vs-last{font-size:12.5px;margin-top:8px;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:var(--surface-2)}
  .vs-last.up{color:#0A6A4D}.vs-last.down{color:#A52E18}
  .badge{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap}
  .badge .dot{width:8px;height:8px;border-radius:50%}
  .badge.good{background:var(--green-soft);color:#0A6A4D}.badge.good .dot{background:var(--green)}
  .badge.warn{background:var(--amber-soft);color:#9A610E}.badge.warn .dot{background:var(--amber)}
  .badge.bad{background:var(--coral-soft);color:#A52E18}.badge.bad .dot{background:var(--coral)}

  .flow{margin-top:22px}
  .flow-title{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:9px}
  .flow-bar{position:relative;height:30px;border-radius:9px;background:var(--surface-2);display:flex;overflow:hidden;border:1px solid var(--line)}
  .seg{height:100%;transition:width .7s cubic-bezier(.22,.8,.3,1);min-width:0}
  .seg.fixed{background:var(--teal)}.seg.variable{background:var(--amber)}.seg.debt{background:var(--coral)}
  .seg.free{background:repeating-linear-gradient(135deg,var(--green-soft),var(--green-soft) 7px,#E8F6EF 7px,#E8F6EF 14px)}
  .seg.over{background:repeating-linear-gradient(135deg,var(--coral),var(--coral) 7px,#C53C25 7px,#C53C25 14px)}
  .income-line{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.85}
  .income-line::after{content:"ingreso";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink);white-space:nowrap;font-weight:500}
  .legend{display:flex;flex-wrap:wrap;gap:14px 18px;margin-top:14px}
  .legend span{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft)}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .legend i.fixed{background:var(--teal)}.legend i.variable{background:var(--amber)}.legend i.debt{background:var(--coral)}.legend i.free{background:var(--green)}
  .legend b{color:var(--ink);font-weight:600}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .stat{background:var(--surface-2);border-radius:13px;padding:13px 14px}
  .stat .k{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
  .stat .v{font-size:19px;font-weight:600;margin-top:3px}
  .stat .v.pos{color:var(--green)}.stat .v.neg{color:var(--coral)}

  .advice{background:var(--surface);border-radius:var(--radius);padding:20px 22px;margin-top:16px;box-shadow:var(--shadow);border-left:4px solid var(--teal)}
  .advice.good{border-left-color:var(--green)}.advice.warn{border-left-color:var(--amber)}.advice.bad{border-left-color:var(--coral)}
  .advice .coach{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .advice h3{font-family:"Fraunces",serif;font-size:18px;font-weight:600;margin-bottom:6px}
  .advice p{font-size:14px;color:var(--ink-soft);margin-bottom:8px}
  .advice p:last-child{margin-bottom:0}
  .advice b{color:var(--ink)}
  .advice ul{margin:6px 0 0 2px;list-style:none}
  .advice li{font-size:13.5px;color:var(--ink-soft);padding-left:18px;position:relative;margin-bottom:5px}
  .advice li::before{content:"→";position:absolute;left:0;color:var(--teal);font-weight:600}

  .rule-head{display:flex;align-items:center;gap:10px;margin-top:16px;margin-bottom:12px;flex-wrap:wrap}
  .rule-tag{font-family:"Fraunces";font-size:22px;font-weight:600;color:var(--teal)}
  .rule-name{font-size:13px;color:var(--ink-soft);background:var(--teal-soft);padding:4px 11px;border-radius:99px;font-weight:500}
  .rule{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .rule .cell{background:var(--surface-2);border-radius:11px;padding:12px 13px}
  .rule .cell .lab{font-size:12px;color:var(--ink-soft)}
  .rule .cell .target{font-size:16px;font-weight:600;margin-top:2px}
  .rule .cell .meter{height:6px;background:#E5EAE6;border-radius:99px;margin-top:9px;overflow:hidden}
  .rule .cell .meter i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
  .rule .cell .now{font-size:11px;margin-top:6px;color:var(--ink-faint)}
  .rule .cell .now.over{color:var(--coral);font-weight:600}

  .block{background:var(--surface);border-radius:var(--radius);padding:18px 20px;margin-top:16px;box-shadow:var(--shadow)}
  .block-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
  .block-head .ttl{display:flex;align-items:baseline;gap:10px}
  .block-head h2{font-family:"Fraunces",serif;font-size:20px;font-weight:600}
  .block-head .sum{font-size:14px;font-weight:600;color:var(--ink-soft)}
  .block-desc{font-size:12.5px;color:var(--ink-faint);margin-bottom:10px}
  .add-btn{background:var(--teal);color:#fff;border:none;font-family:inherit;font-weight:600;font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,transform .05s;white-space:nowrap}
  .add-btn:hover{background:#0F3F38}.add-btn:active{transform:scale(.97)}
  .add-btn.ghost{background:var(--surface-2);color:var(--teal)}.add-btn.ghost:hover{background:var(--teal-soft)}

  .budget-meter{background:var(--surface-2);border-radius:11px;padding:11px 13px;margin-bottom:12px}
  .budget-meter .bm-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:7px;gap:8px}
  .budget-meter .bm-top b{color:var(--ink);font-weight:600}
  .budget-meter .bar{height:8px;background:#E5EAE6;border-radius:99px;overflow:hidden}
  .budget-meter .bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
  .budget-meter .msg{font-size:12px;margin-top:7px;font-weight:500}

  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:none}
  .row .cat-dot{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:15px;background:var(--surface-2)}
  .row .info{flex:1;min-width:0}
  .row .name{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta{font-size:12px;color:var(--ink-faint)}
  .row .amt{font-size:15px;font-weight:600;white-space:nowrap}
  .row .acts{display:flex;gap:4px}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:6px;border-radius:8px;display:grid;place-items:center;transition:.15s;font-size:14px}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink)}
  .icon-btn.del:hover{background:var(--coral-soft);color:var(--coral)}
  .empty{font-size:13.5px;color:var(--ink-faint);padding:14px 0;text-align:center}
  .debt-prog{height:5px;background:#E5EAE6;border-radius:99px;margin-top:7px;overflow:hidden}
  .debt-prog i{display:block;height:100%;background:var(--coral);border-radius:99px}

  /* Debt plan */
  .plan-order{margin:4px 0 6px;list-style:none}
  .plan-order li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .plan-order li:first-child{border-top:none}
  .plan-rank{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:var(--coral)}
  .plan-rank.r2{background:#E89B3C}.plan-rank.r3{background:#C9A227}.plan-rank.rx{background:var(--ink-faint)}
  .plan-order .pinfo{flex:1;min-width:0}
  .plan-order .pname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plan-order .pmeta{font-size:11.5px;color:var(--ink-faint)}
  .plan-order .pbal{font-size:13.5px;font-weight:600;white-space:nowrap}
  .methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .method{border-radius:13px;padding:13px 14px;border:1.5px solid var(--line)}
  .method.pick{border-color:var(--teal);background:var(--teal-soft)}
  .method .mn{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .method .mtag{font-size:9.5px;background:var(--teal);color:#fff;padding:2px 7px;border-radius:99px;font-weight:600;letter-spacing:.02em}
  .method .mrow{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:8px}
  .method .mrow b{color:var(--ink);font-weight:600}
  .plan-note{font-size:12.5px;color:var(--ink-soft);margin-top:12px;background:var(--surface-2);padding:11px 13px;border-radius:11px}
  .plan-note b{color:var(--ink)}

  .goal-card{background:var(--surface);border-radius:var(--radius);padding:18px 20px;margin-top:16px;box-shadow:var(--shadow)}
  .goal-card .gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .goal-bar{height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .goal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#13C28C);border-radius:99px;transition:width .7s ease}
  .goal-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-top:8px}

  .hist-card{background:var(--surface);border-radius:var(--radius);padding:18px 20px;margin-top:16px;box-shadow:var(--shadow)}
  .hist-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}
  .hist-head h2{font-family:"Fraunces";font-size:20px;font-weight:600}
  .chart-wrap{margin-top:14px;width:100%;overflow:hidden}
  .chart-wrap svg{width:100%;height:auto;display:block}
  .hist-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .hist-stats .hs{background:var(--surface-2);border-radius:11px;padding:11px 12px}
  .hist-stats .hs .k{font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft)}
  .hist-stats .hs .v{font-size:16px;font-weight:600;margin-top:2px}
  .hist-table{margin-top:14px}
  .hist-row{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
  .hist-row.head{border-top:none;color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .hist-row .mlab{font-weight:600;display:flex;align-items:center;gap:6px}
  .hist-row .livetag{font-size:9.5px;background:var(--green-soft);color:#0A6A4D;padding:2px 6px;border-radius:99px;font-weight:600;letter-spacing:0}
  .hist-row .sv.pos{color:var(--green);font-weight:600}.hist-row .sv.neg{color:var(--coral);font-weight:600}
  .close-month-btn{width:100%;margin-top:16px;background:var(--surface-2);color:var(--teal);border:1.5px dashed var(--teal-soft);font-family:inherit;font-weight:600;font-size:14px;padding:14px;border-radius:13px;cursor:pointer;transition:.15s}
  .close-month-btn:hover{background:var(--teal-soft)}

  .overlay{position:fixed;inset:0;background:rgba(17,36,31,.5);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .modal{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 22px 26px;box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:rise .25s cubic-bezier(.2,.8,.3,1)}
  @keyframes rise{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  @media(min-width:560px){.overlay{align-items:center}.modal{border-radius:22px}}
  .modal h3{font-family:"Fraunces",serif;font-size:21px;font-weight:600;margin-bottom:6px}
  .modal .mintro{font-size:13px;color:var(--ink-soft);margin-bottom:16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:500}
  .field input,.field select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px}
  .field input:focus,.field select:focus{outline:none;border-color:var(--teal);background:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-acts{display:flex;gap:10px;margin-top:8px}
  .btn{flex:1;font-family:inherit;font-weight:600;font-size:14.5px;padding:13px;border-radius:12px;border:none;cursor:pointer;transition:.15s}
  .btn.primary{background:var(--teal);color:#fff}.btn.primary:hover{background:#0F3F38}
  .btn.secondary{background:var(--surface-2);color:var(--ink-soft)}.btn.secondary:hover{background:var(--line)}
  .hint{font-size:11.5px;color:var(--ink-faint);margin-top:-8px;margin-bottom:14px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);max-width:440px;width:calc(100% - 36px);background:var(--ink);color:#fff;padding:14px 16px;border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.25);font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.8,.3,1);z-index:80;display:flex;align-items:center;gap:11px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:14px}
  .toast.good{background:#0C4A38}.toast.good .ico{background:var(--green)}
  .toast.warn{background:#7A4D0A}.toast.warn .ico{background:var(--amber)}
  .toast.bad{background:#7A2415}.toast.bad .ico{background:var(--coral)}

  footer{text-align:center;font-size:12px;color:var(--ink-faint);margin-top:28px;padding:0 18px;line-height:1.6}
  .reset-link{color:var(--ink-faint);text-decoration:underline;cursor:pointer;background:none;border:none;font:inherit;font-size:12px}

  @media(max-width:480px){
    .status-big{font-size:38px}
    .stats{grid-template-columns:1fr;gap:8px}.stat{display:flex;justify-content:space-between;align-items:center}.stat .v{font-size:17px}
    .rule{grid-template-columns:1fr}
    .hist-stats{grid-template-columns:1fr}.hist-stats .hs{display:flex;justify-content:space-between;align-items:center}.hist-stats .hs .v{font-size:15px}
    .hist-row{grid-template-columns:1.2fr 1fr .8fr;gap:6px;font-size:12px}
    .hist-row .col-gasto{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="mark"></span><h1>Saldo</h1></div>
    <div class="tag">Tu maestra de finanzas, mes a mes.</div>

    <div class="income-card">
      <div>
        <div class="lbl">Ingreso neto mensual</div>
        <div class="income-amt" id="incomeDisplay" title="Toca para editar">
          <span id="incomeText">$0</span><span class="pen">✎</span>
        </div>
      </div>
      <div class="freq-toggle" id="freqToggle" title="Cómo ingresas tu sueldo">
        <button data-f="month" class="on">Mensual</button>
        <button data-f="biweek">Quincenal</button>
      </div>
    </div>
    <div class="month-pill"><span class="live-dot"></span>Mes en curso: <b id="monthLabel">—</b><span style="color:var(--ink-faint)">· en progreso</span></div>
  </header>

  <section class="hero" id="hero"></section>
  <section class="advice" id="advice"></section>

  <section class="block" id="fixedBlock"></section>
  <section class="block" id="variableBlock"></section>
  <section class="block" id="debtBlock"></section>
  <section class="block" id="debtPlanBlock"></section>
  <section class="goal-card" id="goalBlock"></section>
  <section class="hist-card" id="histBlock"></section>

  <footer>
    Saldo guarda tus datos en este dispositivo automáticamente. No es asesoría financiera profesional: es una herramienta de cálculo para ayudarte a organizarte.<br>
    <button class="reset-link" id="resetBtn">Borrar todos mis datos</button>
  </footer>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"><span class="ico" id="toastIco"></span><span id="toastMsg"></span></div>

<script>
const fmtMXN = new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const money = n => fmtMXN.format(Math.round(n||0));
const moneyK = n => { n=Math.round(n||0); const a=Math.abs(n); if(a>=1000){let v=(n/1000); return '$'+(v%1===0?v:v.toFixed(1))+'k';} return '$'+n; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function monthKeyNow(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function labelFromKey(k){const[y,m]=k.split('-').map(Number);return MESES[m-1]+' '+y;}
function shortKey(k){const[y,m]=k.split('-').map(Number);return MESES[m-1].slice(0,3)+" '"+String(y).slice(2);}
function nextKey(k){let[y,m]=k.split('-').map(Number);m++;if(m>12){m=1;y++;}return y+'-'+String(m).padStart(2,'0');}
function monthsText(m){if(m>=1200)return 'más de 100 años';const y=Math.floor(m/12),mm=m%12;if(y<=0)return m+(m===1?' mes':' meses');if(mm===0)return y+(y===1?' año':' años');return y+(y===1?' año':' años')+' y '+mm+(mm===1?' mes':' meses');}

/* ---------- Blindaje global: silencia solo ruido de almacenamiento ---------- */
(function(){try{
  function isNoise(m){m=String(m||'').toLowerCase();return m.indexOf('storage')>-1||m.indexOf('script error')>-1||m==='';}
  window.addEventListener('error',function(e){ if(isNoise(e&&e.message)){try{e.preventDefault();}catch(_){}}},true);
  window.addEventListener('unhandledrejection',function(e){try{e.preventDefault();}catch(_){}});
  window.onerror=function(msg){ return isNoise(msg); };
}catch(_){}})();
function safe(fn){try{return fn();}catch(e){}}

/* ---------- Almacenamiento robusto (respaldo en memoria) ----------
   Si el almacenamiento del entorno falla una vez, se desactiva y se usa solo
   memoria durante la sesión. Así registrar nunca lanza un error en pantalla. */
let _storageOK=true;
const _mem={};
function storageWrite(key,val){
  _mem[key]=val;
  if(!_storageOK)return;
  try{
    if(!(window.storage&&typeof window.storage.set==='function')){_storageOK=false;return;}
    const p=window.storage.set(key,val,false); // 'shared' explícito
    if(p&&typeof p.then==='function')p.then(function(){},function(){_storageOK=false;});
  }catch(e){_storageOK=false;}
}
async function storageRead(key){
  try{
    if(window.storage&&typeof window.storage.get==='function'){
      const r=await window.storage.get(key,false);
      if(r&&r.value!==undefined&&r.value!==null)return r.value;
    }
  }catch(e){_storageOK=false;}
  return _mem[key];
}
function save(){ try{storageWrite('saldo:data',JSON.stringify(state));}catch(e){} }
async function load(){
  let raw=null;
  try{raw=await storageRead('saldo:data');}catch(e){}
  try{if(raw)state=Object.assign(state,JSON.parse(raw));}catch(e){}
  if(!state.monthKey)state.monthKey=monthKeyNow();
  if(!Array.isArray(state.history))state.history=[];
  try{render();}catch(e){}
}

/* ---------- Cálculo del mes ---------- */
function calc(){
  const income=state.income||0;
  const fixedTotal=state.fixed.reduce((s,x)=>s+(+x.amount||0),0);
  const varTotal=state.variable.reduce((s,x)=>s+(+x.amount||0),0);
  const debtTotal=state.debts.reduce((s,x)=>s+(+x.payment||0),0);
  const spent=fixedTotal+varTotal+debtTotal;
  const left=income-spent;
  const rate=income>0?left/income:0;
  return {income,fixedTotal,varTotal,debtTotal,spent,left,rate};
}

/* ---------- Motor: reparto óptimo ---------- */
const PRESETS=[
  {n:50,d:30,a:20,name:'Equilibrado'},{n:60,d:30,a:10,name:'Estable'},
  {n:60,d:20,a:20,name:'Enfocado'},{n:70,d:20,a:10,name:'Ingreso ajustado'},
  {n:50,d:20,a:30,name:'Acelera metas'},{n:40,d:30,a:30,name:'Ahorro fuerte'},
  {n:80,d:10,a:10,name:'Modo apriete'},
];
function recommend(c){
  if(c.income<=0) return null;
  const income=c.income;
  const hasDebt=state.debts.some(d=>(+d.balance)>0);
  const highInt=state.debts.some(d=>(+d.balance)>0 && (+d.rate)>=15);
  let targetA;
  if(highInt) targetA=0.30; else if(hasDebt) targetA=0.25; else targetA=0.20;
  if(c.left<0) targetA=Math.max(0.10,targetA-0.10);
  const needsAmt=c.fixedTotal;
  let saveAmt=targetA*income;
  let wantsAmt=income-needsAmt-saveAmt;
  const minWants=income*0.05;
  if(wantsAmt<minWants){ wantsAmt=Math.max(0,minWants); saveAmt=Math.max(0,income-needsAmt-wantsAmt); }
  const nP=Math.round(needsAmt/income*100), aP=Math.round(saveAmt/income*100);
  let dP=100-nP-aP; if(dP<0)dP=0;
  let best=PRESETS[0],bd=1e9;
  for(const p of PRESETS){const dist=Math.abs(p.n-nP)+Math.abs(p.d-dP)+Math.abs(p.a-aP);if(dist<bd){bd=dist;best=p;}}
  return {needsAmt,wantsAmt,saveAmt,nP,dP,aP,preset:best,hasDebt,highInt,needsTooHigh:nP>70};
}

/* ---------- Motor: plan de deudas ---------- */
function activeDebts(){ return state.debts.filter(d=>(+d.balance)>0); }
function orderDebts(strategy){
  const d=activeDebts().slice();
  if(strategy==='avalanche') d.sort((a,b)=>((+b.rate||0)-(+a.rate||0))||((+a.balance)-(+b.balance)));
  else d.sort((a,b)=>((+a.balance)-(+b.balance))||((+b.rate||0)-(+a.rate||0)));
  return d;
}
// Simula el pago mes a mes. extra = dinero adicional aplicado a la deuda prioritaria.
function simulate(extra,strategy){
  let debts=activeDebts().map(x=>({bal:+x.balance,min:+x.payment||0,mr:(+x.rate||0)/100/12}));
  if(!debts.length) return {months:0,interest:0,capped:false};
  let months=0,interest=0; const CAP=1200;
  while(debts.some(d=>d.bal>0.5)&&months<CAP){
    months++;
    for(const d of debts){ if(d.bal>0){ const it=d.bal*d.mr; d.bal+=it; interest+=it; } }
    let budget=debts.reduce((s,d)=>s+(d.bal>0?d.min:0),0)+extra;
    const active=debts.filter(d=>d.bal>0);
    if(strategy==='avalanche') active.sort((a,b)=>b.mr-a.mr||a.bal-b.bal);
    else active.sort((a,b)=>a.bal-b.bal||b.mr-a.mr);
    for(const d of active){ const pay=Math.min(d.min,d.bal,budget); if(pay>0){d.bal-=pay;budget-=pay;} }
    for(const d of active){ if(budget<=0.5)break; if(d.bal>0){const pay=Math.min(budget,d.bal);d.bal-=pay;budget-=pay;} }
  }
  return {months,interest:Math.round(interest),capped:months>=CAP};
}

function ruleCell(label,targetAmt,nowPct,targetPct,color){
  const w=Math.min(nowPct/Math.max(targetPct,1)*100,100);
  const over=nowPct>targetPct+2;
  return `<div class="cell"><div class="lab">${label}</div><div class="target num">${money(targetAmt)}</div>
    <div class="meter"><i style="width:${w}%;background:${over?'var(--coral)':color}"></i></div>
    <div class="now ${over?'over':''}">ahora ${nowPct.toFixed(0)}% · meta ${targetPct}%</div></div>`;
}

/* ---------- Plan de salida de deudas ---------- */
function renderDebtPlan(){
  const el=document.getElementById('debtPlanBlock');
  const act=activeDebts();
  if(act.length<1){ el.style.display='none'; return; }
  el.style.display='block';
  const c=calc();
  const extra=Math.max(0,c.left); // dinero libre que puede acelerar el pago
  const hasRates=act.some(d=>(+d.rate||0)>0);
  const recStrat = hasRates ? 'avalanche' : 'snowball';
  const order=orderDebts(recStrat);

  // lista ordenada
  const orderHtml=order.map((d,i)=>{
    const rankCls=i===0?'':(i===1?'r2':(i===2?'r3':'rx'));
    const why=hasRates?(d.rate>0?`${d.rate}% de interés anual`:'sin interés'):`saldo más bajo`;
    return `<li><span class="plan-rank ${rankCls}">${i+1}</span>
      <div class="pinfo"><div class="pname">${escapeHtml(d.name||'Deuda')}</div>
      <div class="pmeta">${why} · pago ${money(d.payment)}/mes</div></div>
      <div class="pbal num">${money(d.balance)}</div></li>`;
  }).join('');

  // simulaciones
  const ava=simulate(extra,'avalanche');
  const snow=simulate(extra,'snowball');
  const baseMin=simulate(0,recStrat); // solo mínimos, sin dinero extra

  let methodsHtml='';
  if(act.length>=2 && hasRates){
    const avaPick=ava.interest<=snow.interest;
    methodsHtml=`<div class="methods">
      <div class="method ${avaPick?'pick':''}">
        <div class="mn">Avalancha ${avaPick?'<span class="mtag">recomendado</span>':''}</div>
        <div class="mrow"><span>Libre de deudas</span><b>${ava.capped?'+100 años':monthsText(ava.months)}</b></div>
        <div class="mrow"><span>Intereses totales</span><b>${ava.capped?'—':money(ava.interest)}</b></div>
      </div>
      <div class="method ${!avaPick?'pick':''}">
        <div class="mn">Bola de nieve ${!avaPick?'<span class="mtag">recomendado</span>':''}</div>
        <div class="mrow"><span>Libre de deudas</span><b>${snow.capped?'+100 años':monthsText(snow.months)}</b></div>
        <div class="mrow"><span>Intereses totales</span><b>${snow.capped?'—':money(snow.interest)}</b></div>
      </div></div>`;
  }

  // nota / explicación
  let note;
  const cappedAll = baseMin.capped && (extra<=0);
  if(cappedAll){
    note=`<b>Atención:</b> con los pagos actuales, los intereses crecen más rápido de lo que abonas y la deuda no se liquidaría. Sube el pago mensual de la deuda con mayor tasa o libera dinero recortando gastos.`;
  }else if(extra>0){
    const saveMonths=Math.max(0,baseMin.months-ava.months);
    const saveInt=Math.max(0,baseMin.interest-(hasRates?ava.interest:snow.interest));
    note=`Si destinas tu dinero libre de <b>${money(extra)}/mes</b> a abonar de más (empezando por la deuda #1), quedas libre de deudas en <b>${monthsText((hasRates?ava:snow).months)}</b>`+
      (saveMonths>0?`, unos <b>${monthsText(saveMonths)}</b> antes que pagando solo los mínimos`:'')+
      (hasRates&&saveInt>0?` y te ahorras cerca de <b>${money(saveInt)}</b> en intereses`:'')+`.`;
  }else{
    note=`Pagando solo los mínimos quedas libre en <b>${baseMin.capped?'más de 100 años':monthsText(baseMin.months)}</b>. Para acelerar, necesitas liberar dinero: revisa tus gastos variables y mete ese excedente a la deuda #1.`;
  }
  if(act.length>=2){
    if(hasRates) note+=` <br><br><b>Por qué este orden:</b> atacar primero la de mayor tasa (avalancha) es lo que menos intereses paga. Si te motivan las victorias rápidas, la bola de nieve liquida primero la de menor saldo.`;
    else note+=` <br><br>Agrega la <b>tasa de interés</b> de cada deuda y podré decirte si te conviene más el método avalancha (ahorra intereses).`;
  }

  el.innerHTML=`<div class="block-head"><div class="ttl"><h2>Plan de salida de deudas</h2></div></div>
    <div class="block-desc">En qué orden conviene liquidarlas para ${hasRates?'ahorrar más intereses':'avanzar más rápido'}.</div>
    <ul class="plan-order">${orderHtml}</ul>
    ${methodsHtml}
    <div class="plan-note">${note}</div>`;
}

/* ---------- Historial ---------- */
function buildSeries(){
  const c=calc(),live={key:state.monthKey,saved:c.left,income:c.income,fixed:c.fixedTotal,variable:c.varTotal,debt:c.debtTotal,live:true};
  const arr=(state.history||[]).filter(h=>h.key!==state.monthKey).map(h=>Object.assign({live:false},h));
  arr.push(live); arr.sort((a,b)=>a.key<b.key?-1:1);
  return arr.slice(-12);
}
function renderHistory(){
  const el=document.getElementById('histBlock');
  const series=buildSeries(), closed=(state.history||[]);
  const chart=series.length?chartSVG(series):'';
  let statsHtml='';
  if(closed.length){
    const avg=closed.reduce((s,x)=>s+x.saved,0)/closed.length;
    const best=closed.reduce((m,h)=>h.saved>m.saved?h:m,closed[0]);
    const pos=closed.filter(h=>h.saved>=0).length;
    statsHtml=`<div class="hist-stats">
      <div class="hs"><div class="k">Ahorro promedio</div><div class="v num" style="color:${avg>=0?'var(--green)':'var(--coral)'}">${money(avg)}</div></div>
      <div class="hs"><div class="k">Tu mejor mes</div><div class="v num">${shortKey(best.key)} · ${money(best.saved)}</div></div>
      <div class="hs"><div class="k">Meses en verde</div><div class="v num">${pos} de ${closed.length}</div></div></div>`;
  }
  let table='';
  if(series.length){
    table=`<div class="hist-table">
      <div class="hist-row head"><span>Mes</span><span>Ingreso</span><span class="col-gasto">Gastos</span><span style="text-align:right">Ahorro</span></div>
      ${series.slice().reverse().map(h=>`<div class="hist-row">
        <span class="mlab">${shortKey(h.key)}${h.live?'<span class="livetag">en curso</span>':''}</span>
        <span class="num">${money(h.income)}</span>
        <span class="num col-gasto">${money((h.fixed||0)+(h.variable||0)+(h.debt||0))}</span>
        <span class="num sv ${h.saved>=0?'pos':'neg'}" style="text-align:right">${money(h.saved)}</span></div>`).join('')}</div>`;
  }
  const onlyLive=closed.length===0;
  el.innerHTML=`<div class="hist-head"><h2>Tu evolución</h2></div>
    <div class="block-desc">${onlyLive?'Aún no cierras ningún mes. Al terminar el mes, pulsa el botón de abajo y empezarás a ver tu tendencia aquí.':'Cómo ha cambiado tu ahorro mes a mes.'}</div>
    ${chart}${statsHtml}${table}
    <button class="close-month-btn" onclick="askCloseMonth()">✓ Cerrar ${labelFromKey(state.monthKey)} y empezar el siguiente mes</button>`;
}
function chartSVG(series){
  const W=680,H=190,padB=26,padT=22,padX=8;
  const n=series.length, gap=8;
  const bw=Math.min(54,(W-padX*2-gap*(n-1))/n);
  const totalW=bw*n+gap*(n-1), startX=(W-totalW)/2;
  const maxAbs=Math.max(1,...series.map(s=>Math.abs(s.saved)));
  const zeroY=padT+(H-padT-padB)/2;
  const scale=(H-padT-padB)/2/maxAbs;
  let bars='';
  series.forEach((s,i)=>{
    const x=startX+i*(bw+gap);
    const h=Math.abs(s.saved)*scale, pos=s.saved>=0;
    const y=pos?zeroY-h:zeroY, col=pos?'#0E9E73':'#E14B33', op=s.live?'.55':'1';
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="4" fill="${col}" opacity="${op}"/>`;
    const lblY=pos?y-5:y+h+12;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${lblY.toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${col}" font-family="Space Grotesk">${moneyK(s.saved)}</text>`;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${(H-8).toFixed(1)}" text-anchor="middle" font-size="10" fill="#8A968F" font-family="Space Grotesk">${shortKey(s.key)}</text>`;
  });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de ahorro mensual">
    <line x1="${padX}" y1="${zeroY.toFixed(1)}" x2="${W-padX}" y2="${zeroY.toFixed(1)}" stroke="#DFE5E0" stroke-width="1.5"/>${bars}</svg></div>`;
}

function doCloseMonth(){
  try{

    state.debts.forEach(d=>{
      let bal=+d.balance||0, pay=+d.payment||0, rate=+d.rate||0;
      if(bal>0&&pay>0){ if(rate>0)bal+=bal*(rate/100/12); bal-=pay; d.balance=Math.max(0,Math.round(bal)); }

    state.variable=[];
    state.monthKey=nextKey(state.monthKey);
  }catch(e){}
  try{save();}catch(e){}try{closeModal();}catch(e){}try{render();}catch(e){}

/* ---------- Helpers ---------- */
function monthsToPay(b,p,r){
  if(!b||b<=0)return 0; if(!p||p<=0)return Infinity;
  if(!r||r<=0)return Math.ceil(b/p);
  const m=r/100/12; if(p<=b*m)return Infinity;
  return Math.ceil(-Math.log(1-(b*m)/p)/Math.log(1+m));
}
function escapeHtml(s){return(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
